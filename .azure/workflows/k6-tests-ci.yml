trigger: none

pr: none

parameters:
  - name: profile
    displayName: 'Load profile'
    type: string
    default: 'neoload'
    values: ['neoload', 'neoload-smoke']
  - name: releaseVersion
    displayName: 'Release version'
    type: string
    default: '26_2'
    values: ['main', '26_2', '26_1', '25_4']
  - name: fidelity
    displayName: 'Fidelity tier'
    type: string
    default: 'lean'
    values: ['lean', 'ui', 'full']
  - name: pacing
    displayName: 'Iteration pacing (seconds)'
    type: number
    default: 300
  - name: k6Version
    displayName: 'k6 version (release tag, or "latest")'
    type: string
    default: 'v2.0.0'

variables:
  profile: ${{ parameters.profile }}
  releaseVersion: ${{ parameters.releaseVersion }}
  fidelity: ${{ parameters.fidelity }}
  pacing: ${{ parameters.pacing }}
  k6Version: ${{ parameters.k6Version }}
  site: 'PERF'
  specPath: 'source/tests/neoload.spec.ts'
  datadogEndpoint: 'otlp.datadoghq.com:443'
  datadogMetricsUrl: 'https://api.datadoghq.com/api/v2/series'
  datadogEnv: 'dev'

jobs:
  - job: RunK6
    displayName: 'Run k6 load tests'
    timeoutInMinutes: 60
    pool:
      name: 'Momentus-Cloud'
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: 'Install Node.js'
        inputs:
          versionSource: 'spec'
          versionSpec: '20.x'

      - script: npm ci
        displayName: 'Install dependencies (npm ci)'

      - powershell: |
          npm run setup -- --site "$env:SITE" --env "$env:RELEASE"
        displayName: 'Write setup.json'
        env:
          SITE: $(site)
          RELEASE: $(releaseVersion)

      - powershell: |
          npm run secret -- --key "$env:K6_DECRYPT_KEY"
        displayName: 'Write secret.json (decryption passphrase)'
        env:
          K6_DECRYPT_KEY: $(K6_DECRYPT_KEY)

      - powershell: |
          .azure/scripts/install-k6.ps1 -Version '$(k6Version)'
        displayName: 'Install k6'

      - powershell: |
          .azure/scripts/run-k6.ps1 `
            -SpecPath '$(specPath)' `
            -ReleaseVersion '$(releaseVersion)' `
            -LoadProfile '$(profile)' `
            -Fidelity '$(fidelity)' `
            -Pacing $(pacing) `
            -Site '$(site)' `
            -DatadogEnv '$(datadogEnv)' `
            -DatadogEndpoint '$(datadogEndpoint)' `
            -DatadogMetricsUrl '$(datadogMetricsUrl)'
          exit $LASTEXITCODE
        displayName: 'Run k6 load test'
        errorActionPreference: continue
        failOnStderr: false
        env:
          DD_API_KEY: $(DD_API_KEY)

      - powershell: |
          k6 inspect --execution-requirements -e PROFILE=$(profile) "$(specPath)" | Out-File -FilePath temp/exec-req.json -Encoding utf8
          node .azure/scripts/resource-grapher.cjs reports/resources/resource-usage.csv reports/resources/resource-usage.html "$(specPath)" temp/exec-req.json
          node .azure/scripts/gc-grapher.cjs reports/resources/gc-usage.csv reports/resources/gc-usage.html "$(specPath)" temp/exec-req.json
        displayName: 'Generate resource & GC utilization graphs'
        condition: always()

      - powershell: |
          node .azure/scripts/group-aggregator.cjs reports/metrics/k6-metrics.json.gz reports/metrics/group-metrics.csv reports/metrics/group-metrics.html "$(specPath)" temp/exec-req.json
        displayName: 'Aggregate per-transaction (group) metrics'
        condition: always()

      - publish: '$(Build.SourcesDirectory)/reports'
        artifact: 'k6-results'
        displayName: 'Publish k6 results artifact'
        condition: always()

      - powershell: |
          .azure/scripts/cleanup-agent.ps1
        displayName: 'Cleanup (remove secret + k6 binary)'
        condition: always()
