# Manually-triggered pipeline (queue on demand). It runs the k6 load test against the target
# environment on a self-hosted Windows agent and publishes the HTML report + console log.
# Does not trigger on commits or PRs — use k6-tests-ci-dev.yml for PR validation.

trigger: none

pr: none

# Surfaced as a dropdown in the queue dialog. 'neoload' is the full 5m + 35m load model;
# 'neoload-smoke' is the same 50-VU shape compressed to 2m + 8m, for validating the pipeline and the
# live Datadog dashboard without paying for a 40-minute run. Shapes live in source/config/profiles.config.ts.
parameters:
  - name: profile
    displayName: 'Load profile'
    type: string
    default: 'neoload'
    values:
      - 'neoload'
      - 'neoload-smoke'

variables:
  # K6_DECRYPT_KEY (the passphrase used to mint source/data/users.data.ts) is NOT defined here — it is
  # a secret pipeline variable set in the UI (Edit pipeline > Variables > new var, "Keep this value
  # secret"). Secrets must never be committed in YAML. It is referenced as $(K6_DECRYPT_KEY) below.
  - name: site
    value: 'PERF'
  - name: releaseVersion
    value: '26_2'
  # The load spec k6 runs and graphs. Referenced by both the run and the resource-graph steps so the
  # test-file name and resolved VU config on the report always match what actually ran.
  - name: specPath
    value: 'source/tests/neoload.spec.ts'
  # Fidelity tier the journeys replay at (see rules/fidelity.md): 'full' fires the UI-chrome + static-asset
  # tiers around the correlated spine for the most realistic load; 'lean'/'ui' lower it. Passed as -e FIDELITY below.
  - name: fidelity
    value: 'lean'
  # Datadog live-run streaming (docs/datadog-live-metrics.md). Metrics go to the agentless OTLP intake, so
  # nothing is installed on the agent. Streaming is skipped automatically when DD_API_KEY is unset, which
  # is the switch to turn it off: DD_API_KEY is a masked secret pipeline variable, never defined here.
  # These are the live-dashboard feed only; the published artifacts remain the reporting source of truth.
  - name: datadogEndpoint
    value: 'otlp.datadoghq.com:443'
  # Agent CPU/RAM go to the plain metrics intake rather than the OTLP one: they come from the resource
  # sampler's CSV, not from k6. Both must point at the same Datadog site.
  - name: datadogMetricsUrl
    value: 'https://api.datadoghq.com/api/v2/series'
  # Mirrors the app's own APM service naming (performance/26_2) so k6 metrics sort next to the service
  # under test, prefixed k6/ so a load generator is never mistaken for an application.
  - name: datadogService
    value: 'k6/performance/$(releaseVersion)'
  - name: datadogEnv
    value: 'dev'

jobs:
  - job: RunK6
    displayName: 'Run k6 load tests'
    # The neoload profile runs 5m ramp + 35m sustain, no ramp-down (~40.5m incl. graceful stop);
    # neoload-smoke is the same 50-VU shape at 2m + 8m (~10.5m). This budget covers the longer of the
    # two plus npm ci, the fresh k6 download, resource graphing, publish and cleanup.
    timeoutInMinutes: 60
    pool:
      # Steps below are OS-agnostic (they detect Windows vs Linux), so no Agent.OS demand is needed.
      # Add a demand (e.g. 'Agent.Name -equals <agent>') only to pin the job to one specific machine.
      name: 'Momentus-Cloud'
      # demands:
      #   - Agent.Name -equals NEOLOAD
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: 'Install Node.js'
        inputs:
          versionSource: 'spec'
          versionSpec: '20.x'

      - script: npm ci
        displayName: 'Install dependencies (npm ci)'

      - powershell: |
          npm run setup -- --site "$env:SITE" --env "$env:RELEASE"
        displayName: 'Write setup.json'
        env:
          SITE: $(site)
          RELEASE: $(releaseVersion)

      - powershell: |
          npm run secret -- --key "$env:K6_DECRYPT_KEY"
        displayName: 'Write secret.json (decryption passphrase)'
        env:
          # Passed via env (not inline $(...)) so the masked secret is not expanded into the build log.
          K6_DECRYPT_KEY: $(K6_DECRYPT_KEY)

      - powershell: |
          $ErrorActionPreference = 'Stop'
          # OS detection that works in both Windows PowerShell 5.1 (Windows agent) and PowerShell Core
          # (Linux agent) — $IsWindows does not exist in 5.1, but $env:OS does.
          $isWin = $env:OS -eq 'Windows_NT'
          if ($isWin) {
            # Windows PowerShell 5.1 may default below TLS 1.2, which GitHub rejects — force TLS 1.2.
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          }
          # Official standalone-binary install (https://grafana.com/docs/k6/latest/set-up/install-k6/):
          # download the GitHub Releases build for this OS and put the k6 binary on PATH. Preferred over
          # winget/choco/apt here because it installs nothing machine-wide and is wiped by the cleanup step.
          # Pin $tag to a specific version (e.g. 'v1.0.0') for reproducibility.
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/grafana/k6/releases/latest' -Headers @{ 'User-Agent' = 'azure-pipelines' }
          $tag = $release.tag_name
          $dest = Join-Path $env:AGENT_TEMPDIRECTORY 'k6'
          # Remove any copy left by a previous run so k6 is always freshly downloaded.
          if (Test-Path $dest) { Remove-Item -Path $dest -Recurse -Force }
          if ($isWin) {
            $asset = "k6-$tag-windows-amd64.zip"
            $archive = Join-Path $env:AGENT_TEMPDIRECTORY 'k6.zip'
            $exe = 'k6.exe'
          } else {
            $asset = "k6-$tag-linux-amd64.tar.gz"
            $archive = Join-Path $env:AGENT_TEMPDIRECTORY 'k6.tar.gz'
            $exe = 'k6'
          }
          if (Test-Path $archive) { Remove-Item -Path $archive -Force }
          $url = "https://github.com/grafana/k6/releases/download/$tag/$asset"
          Write-Host "Downloading k6 $tag from $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if ($isWin) {
            Expand-Archive -Path $archive -DestinationPath $dest -Force
          } else {
            tar -xzf $archive -C $dest
          }
          $k6path = (Get-ChildItem -Path $dest -Recurse -Filter $exe -File | Select-Object -First 1).FullName
          if (-not $isWin) { chmod +x $k6path }
          Write-Host "##vso[task.prependpath]$(Split-Path $k6path -Parent)"
          & $k6path version
        displayName: 'Install k6 (fresh download)'

      - powershell: |
          # Every report/log this run produces lands under reports/<category>/ (never bare temp/), so
          # the later staging step can just copy the whole tree — nothing sensitive is ever written here.
          New-Item -ItemType Directory -Force -Path 'reports/dashboard', 'reports/metrics', 'reports/resources', 'reports/logs' | Out-Null
        displayName: 'Ensure report folders exist'

      - powershell: |
          # Sample agent CPU/RAM/network/load in the background for the duration of the k6 run.
          # Linux agents use the Node sampler (/proc); Windows agents use the Get-Counter sampler.
          $isWin = $env:OS -eq 'Windows_NT'
          if ($isWin) {
            $sampler = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.azure/scripts/resource-sampler.ps1','reports/resources/resource-usage.csv','1' -PassThru -NoNewWindow
          } else {
            $sampler = Start-Process node -ArgumentList '.azure/scripts/resource-sampler.cjs','reports/resources/resource-usage.csv','1' -PassThru -NoNewWindow
          }
          # Sample k6's own Go runtime/GC metrics from its Prometheus endpoint (enabled by --address +
          # --profiling-enabled below); the Node sampler skips ticks until the endpoint is up. This
          # measures the k6 load generator, not the system under test.
          $gcSampler = Start-Process node -ArgumentList '.azure/scripts/gc-sampler.cjs','reports/resources/gc-usage.csv','1','127.0.0.1:6565' -PassThru -NoNewWindow
          $k6Args = @('run','--quiet','--address=127.0.0.1:6565','--profiling-enabled','--out','json=reports/metrics/k6-metrics.json.gz','-e','FIDELITY=$(fidelity)','-e','PROFILE=${{ parameters.profile }}')
          # Stream live metrics to Datadog only when the masked DD_API_KEY variable is actually set, which
          # is also the off switch. An undefined pipeline variable arrives as the literal '$(DD_API_KEY)',
          # so -notmatch keeps that case on the skip path instead of streaming with a junk key. One flag
          # gates both feeds: k6's own metrics over OTLP, and the sampler's agent metrics via the forwarder.
          $streamToDatadog = $env:DD_API_KEY -and $env:DD_API_KEY -notmatch '^\$\('
          if ($streamToDatadog) {
            # Composed here rather than as a step env value so the masked secret is never expanded into
            # the build log, matching how K6_DECRYPT_KEY is handled above.
            $env:K6_OTEL_HEADERS = "dd-api-key=$env:DD_API_KEY"
            # Datadog normalizes metric tag keys AND values to lowercase, so these are snake_case, not
            # camelCase, and site=PERF reads back as site:perf — a hand-typed {site:PERF} filter matches
            # nothing. The release version is deliberately not tagged here: service.version already
            # surfaces it as the `version` tag, and a second copy would drift.
            $k6Args += @('--out','opentelemetry','--tag','site=$(site)','--tag',"build_number=$env:BUILD_BUILDNUMBER")
            # Agent CPU/RAM/network reach Datadog through the sampler's CSV, not through k6, so they need
            # their own feed. The forwarder tails resource-usage.csv and posts gauges to the metrics intake;
            # its tags mirror what OTLP derives from the resource attributes above (service, env, version)
            # plus the run tags, so the dashboard's template variables filter both feeds the same way.
            # Only stderr is redirected, so a failed submit can be raised as a build warning below while
            # the startup line still shows in this log. The CSV artifact is unaffected either way.
            $forwarderTags = "service:$(datadogService),env:$(datadogEnv),version:$(releaseVersion),site:$(site),build_number:$env:BUILD_BUILDNUMBER"
            # Prefixed k6perf. to match K6_OTEL_METRIC_PREFIX below, so both feeds sit in one namespace.
            # This feed was never affected by the integration-metadata problem described there — these are
            # plain gauges on a name the k6 integration does not claim — it is renamed only for coherence.
            $forwarder = Start-Process node -ArgumentList '.azure/scripts/metric-forwarder.cjs','reports/resources/resource-usage.csv','k6perf.agent.','10',$forwarderTags -PassThru -NoNewWindow -RedirectStandardError 'reports/logs/metric-forwarder.log'
            Write-Host "Streaming live metrics to Datadog as service '$env:K6_OTEL_SERVICE_NAME'"
          } else {
            Write-Host 'DD_API_KEY not set - skipping Datadog streaming (published artifacts are unaffected)'
          }
          $k6Args += '$(specPath)'
          try {
            k6 @k6Args 2>&1 | Tee-Object -FilePath reports/logs/k6-console.log
            $code = $LASTEXITCODE
          } finally {
            foreach ($s in $sampler, $gcSampler, $forwarder) {
              if ($s -and -not $s.HasExited) { Stop-Process -Id $s.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          # k6 logs OTLP export failures at info level and still exits 0, so a bad key or blocked egress
          # would leave an empty live dashboard with a green build. Surface it as a warning instead.
          if ((Test-Path reports/logs/k6-console.log) -and (Select-String -Path reports/logs/k6-console.log -Pattern 'failed to upload metrics' -Quiet)) {
            Write-Host "##vso[task.logissue type=warning]Datadog streaming failed during this run - see k6-console.log"
          }
          # Same reasoning for the agent-metric feed: the forwarder logs a rejected submit and keeps going,
          # so without this an empty CPU/RAM graph would sit behind a green build.
          if ((Test-Path reports/logs/metric-forwarder.log) -and (Select-String -Path reports/logs/metric-forwarder.log -Pattern 'submit failed' -Quiet)) {
            Write-Host "##vso[task.logissue type=warning]Agent metric forwarding failed during this run - see metric-forwarder.log"
          }
          exit $code
        displayName: 'Run k6 load test'
        errorActionPreference: continue
        failOnStderr: false
        env:
          # The load run is long enough that the report always renders with graphs, so this keeps k6's
          # default aggregation period (10s) — a 1s period over ~40.5m would bloat report.html.
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: 'reports/dashboard/report.html'
          K6_WEB_DASHBOARD_PERIOD: '10s'
          # Datadog live streaming. The intake accepts delta metrics only and k6 defaults to cumulative,
          # so OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE is required, not optional — without it
          # every export is rejected. Verified against k6 v2.0.0.
          DD_API_KEY: $(DD_API_KEY)
          # Read by metric-forwarder.cjs. The key reaches it the same way, inherited from this block by
          # Start-Process, so the masked value is never placed on a command line.
          DD_METRICS_URL: '$(datadogMetricsUrl)'
          K6_OTEL_EXPORTER_PROTOCOL: 'http/protobuf'
          K6_OTEL_HTTP_EXPORTER_ENDPOINT: '$(datadogEndpoint)'
          K6_OTEL_SERVICE_NAME: '$(datadogService)'
          # Deliberately not 'k6.': Datadog's k6 integration owns that namespace and stamps its own
          # metadata over every k6.http_req_* name it recognises, which leaves them typed for the
          # DogStatsD path rather than as OTLP distributions. Under that claimed metadata the histogram's
          # count and max sub-values stop resolving and both reads fall back to the interval sum, so
          # count:k6.http_req_duration returned the total duration instead of 838 samples and
          # max: returned an interval sum (23340ms) rather than the true slowest request (17687ms).
          # Measured across builds 20260811.1-.3 against the same runs' k6-metrics.json.gz: every
          # integration-owned name (http_req_duration, http_req_waiting) was affected and every name the
          # integration does not claim (group_duration, iteration_duration, think_time) read exactly.
          # The prefix is the only lever k6 exposes here, so moving off the namespace is what restores
          # per-request percentiles. Historical k6.* series stay under the old names and do not migrate.
          K6_OTEL_METRIC_PREFIX: 'k6perf.'
          K6_OTEL_EXPORT_INTERVAL: '10s'
          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: 'delta'
          # k6 registers no histogram view, so its trends inherit the OTel SDK's default explicit buckets,
          # whose top bound is 10s and whose widest step spans 1000-2500ms. Datadog rebuilds averages and
          # percentiles from those buckets and ignores the exact sum on the wire, which inflated a 276.87ms
          # true mean to 387.37 and collapsed p90/p95/p99 onto max. This switches trends to base2 exponential
          # histograms (0.3-1.1% bucket width at the scales k6 picks), which also cut the export payload ~30%
          # since bounds are no longer resent per point. Standard SDK variable, not a K6_OTEL_* one: the k6
          # docs state SDK variables are honored and only K6_OTEL_* take precedence. Verified against k6
          # v2.0.0 by exporting to a local OTLP receiver and reading the wire shape (field 10, not field 9).
          # The intake side is now confirmed too, on build 20260811.3: sum: reads back byte-exact against
          # that run's k6-metrics.json.gz (359507.025ms over 838 samples) and a merged percentile lands
          # within ~2% of k6's own. The averages and percentiles that still read wrong on the dashboard are
          # a query-side aggregation mistake, not a bucket-resolution one — see docs/datadog-live-metrics.md.
          OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: 'base2_exponential_bucket_histogram'
          # service.version is set explicitly because k6 otherwise reports its own version (2.0.0) here,
          # which Datadog maps to the version tag and would not match the app service's 26_2.
          OTEL_RESOURCE_ATTRIBUTES: 'deployment.environment.name=$(datadogEnv),service.version=$(releaseVersion)'

      - powershell: |
          # Resolve the spec's VU config (executor, max VUs, stages, duration) with zero traffic so the
          # report shows what actually ran; Out-File -Encoding utf8 for Node (grapher strips the BOM).
          # k6 inspect reads temp/setup.json + temp/secret.json (still present until cleanup).
          k6 inspect --execution-requirements -e PROFILE=${{ parameters.profile }} "$(specPath)" | Out-File -FilePath temp/exec-req.json -Encoding utf8
          node .azure/scripts/resource-grapher.cjs reports/resources/resource-usage.csv reports/resources/resource-usage.html "$(specPath)" temp/exec-req.json
          node .azure/scripts/gc-grapher.cjs reports/resources/gc-usage.csv reports/resources/gc-usage.html "$(specPath)" temp/exec-req.json
        displayName: 'Generate resource & GC utilization graphs'
        condition: always()

      - powershell: |
          # Aggregate the k6 JSON firehose into per-transaction (group_duration) timings so each k6
          # group compares 1:1 with its NeoLoad transaction. Emits a CSV (for diffing against a
          # NeoLoad export) and an HTML table alongside the other graphs.
          node .azure/scripts/group-aggregator.cjs reports/metrics/k6-metrics.json.gz reports/metrics/group-metrics.csv reports/metrics/group-metrics.html "$(specPath)" temp/exec-req.json
        displayName: 'Aggregate per-transaction (group) metrics'
        condition: always()

      - powershell: |
          New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/k6-results' | Out-Null
        displayName: 'Ensure results staging folder exists'
        condition: always()

      - task: CopyFiles@2
        displayName: 'Stage k6 results'
        condition: always()
        inputs:
          # Every report/log lands under reports/<category>/ (see 'Ensure report folders exist' above),
          # never bare temp/ where the plaintext secret.json lives, so the whole tree copies as-is —
          # no explicit filename allow-list needed.
          SourceFolder: '$(Build.SourcesDirectory)/reports'
          Contents: '**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/k6-results'

      - publish: '$(Build.ArtifactStagingDirectory)/k6-results'
        artifact: 'k6-results'
        displayName: 'Publish k6 results artifact'
        condition: always()

      - powershell: |
          # Runs after publish so nothing sensitive lingers on the persistent self-hosted agent:
          # delete the plaintext passphrase (temp/secret.json) plus the generated setup file, the
          # published reports/ tree, and the freshly downloaded k6 binary.
          foreach ($f in 'temp/secret.json', 'temp/setup.json', 'temp/exec-req.json') {
            if (Test-Path $f) { Remove-Item -Path $f -Force }
          }
          if (Test-Path 'reports') { Remove-Item -Path 'reports' -Recurse -Force }
          foreach ($a in 'k6.zip', 'k6.tar.gz') {
            $p = Join-Path $env:AGENT_TEMPDIRECTORY $a
            if (Test-Path $p) { Remove-Item -Path $p -Force }
          }
          $k6dir = Join-Path $env:AGENT_TEMPDIRECTORY 'k6'
          if (Test-Path $k6dir) { Remove-Item -Path $k6dir -Recurse -Force }
        displayName: 'Cleanup (remove secret + k6 binary)'
        condition: always()
